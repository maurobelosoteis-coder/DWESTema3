<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: head}"></head>

<body class="bg-light text-dark">
<nav th:replace="~{fragments/menu :: menu}"></nav>
  <div class="container py-4">
    <h2 class="h2 fw-bold mb-4">Palmarés del FC Barcelona</h2>
    <p>Palmarés de ejemplo del material de clase.</p>
    <ul class="ps-4">
      <li th:each="titulo : ${titulos}" th:text="${titulo}">Título</li>
    </ul>
    <img th:src="@{/img/barcelona-trofeos.jpg}" alt="Trofeos del Barcelona" class="img-fluid my-4 rounded shadow">
  </div>
</body>

</html>
